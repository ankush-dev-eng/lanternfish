<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" fill="none">
  <!-- Bathymetric grid ring -->
  <circle cx="32" cy="32" r="28" stroke="#1f3b36" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="32" cy="32" r="20" stroke="#1f3b36" stroke-width="1"/>
  
  <!-- Illucium (Stalk filament) -->
  <path d="M 22 42 C 18 24, 26 12, 42 10 C 47 9, 49 14, 45 18" stroke="#8fa8a0" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Esca (Glowing Lure Bulb) -->
  <circle cx="45" cy="18" r="8" fill="#e0a33a" fill-opacity="0.25"/>
  <circle cx="45" cy="18" r="4.5" fill="#e0a33a"/>
  <circle cx="44" cy="17" r="1.5" fill="#e9e4d4"/>
  
  <!-- Stylized Anglerfish Body -->
  <path d="M 12 40 C 18 34, 30 33, 40 38 C 44 40, 43 46, 36 48 C 26 50, 16 48, 10 44 Z" fill="#1f3b36" stroke="#8fa8a0" stroke-width="1.5"/>
  <!-- Sharp translucent needle teeth -->
  <path d="M 36 39 L 37 42 L 39 40 L 40 43 L 42 41" stroke="#e9e4d4" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Eye -->
  <circle cx="28" cy="38" r="1.5" fill="#8fa8a0"/>

  <!-- Logo Typography -->
  <text x="74" y="34" font-family="'Fraunces', Georgia, serif" font-size="20" font-weight="700" letter-spacing="3" fill="#e9e4d4">LANTERNFISH</text>
  <text x="75" y="48" font-family="'IBM Plex Mono', monospace" font-size="8.5" font-weight="500" letter-spacing="1.8" fill="#8fa8a0">CYBER DECEPTION &amp; TRACING</text>
</svg>
