<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200">
  <defs>
    <!-- Radial glow for amber decoy lure -->
    <radialGradient id="amberGlowLure" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0a33a" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#e0a33a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0b1517" stop-opacity="0"/>
    </radialGradient>

    <!-- Radial glow for red breach -->
    <radialGradient id="redBreachGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2553a" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#c2553a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0b1517" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Card -->
  <rect width="880" height="200" rx="8" fill="#0b1517" stroke="#1f3b36" stroke-width="1.5"/>

  <!-- Subtitle / Title -->
  <text x="24" y="32" font-family="'Fraunces', Georgia, serif" font-size="14.5" font-weight="700" fill="#e9e4d4">DECEPTION &amp; TRACING PIPELINE &bull; ADVERSARY TRAVERSAL</text>
  <text x="24" y="49" font-family="'IBM Plex Mono', Consolas, monospace" font-size="10" fill="#8fa8a0">ATT&amp;CK Matrix Kill-Chain Reconstruction &bull; Real-time Tripwire Bait Interception</text>

  <!-- Live Status Chip in Diagram -->
  <g transform="translate(685, 18)">
    <rect width="170" height="24" rx="3" fill="#142824" stroke="#1f3b36" stroke-width="1"/>
    <circle cx="12" cy="12" r="3.5" fill="#e0a33a">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="22" y="15.5" font-family="'IBM Plex Mono', monospace" font-size="8.5" font-weight="600" fill="#e0a33a">RECONSTRUCTION ACTIVE</text>
  </g>

  <!-- Connective Traversal Baseline Path -->
  <g stroke="#1f3b36" stroke-width="2" fill="none">
    <path d="M 110 120 L 290 120 L 470 120 L 650 120 L 780 120"/>
  </g>

  <!-- Active Intrusion Pulse Trail -->
  <path d="M 110 120 L 470 120" stroke="#c2553a" stroke-width="2.5" fill="none" stroke-dasharray="8 4">
    <animate attributeName="stroke-dashoffset" values="36;0" dur="2s" repeatCount="indefinite"/>
  </path>

  <!-- Traveling Adversary Particle -->
  <circle r="5" fill="#e0a33a">
    <animateMotion path="M 110 120 L 290 120 L 470 120 L 650 120" dur="3.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Stage 1: Patient Zero -->
  <g transform="translate(110, 120)">
    <!-- Breach halo animation -->
    <circle r="28" fill="url(#redBreachGlow)">
      <animate attributeName="r" values="22;30;22" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle r="22" fill="#142824" stroke="#c2553a" stroke-width="2"/>
    <text y="4" font-family="'IBM Plex Mono', monospace" font-size="10.5" font-weight="700" fill="#e9e4d4" text-anchor="middle">P0</text>
    <text y="38" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="600" fill="#e9e4d4" text-anchor="middle">ws-dev-02</text>
    <text y="50" font-family="'IBM Plex Mono', monospace" font-size="8.5" fill="#8fa8a0" text-anchor="middle">Initial Foothold</text>
  </g>

  <!-- Stage 2: Lateral Pivot -->
  <g transform="translate(290, 120)">
    <circle r="20" fill="#142824" stroke="#1f3b36" stroke-width="2"/>
    <text y="4" font-family="'IBM Plex Mono', monospace" font-size="9.5" font-weight="700" fill="#e9e4d4" text-anchor="middle">HOP 1</text>
    <text y="38" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="600" fill="#e9e4d4" text-anchor="middle">api-gw-01</text>
    <text y="50" font-family="'IBM Plex Mono', monospace" font-size="8.5" fill="#8fa8a0" text-anchor="middle">Internal Pivot</text>
  </g>

  <!-- Stage 3: Decoy Lure Tripped (Pulsing Glow & Radar Ripple) -->
  <g transform="translate(470, 120)">
    <!-- Expanding ripple -->
    <circle r="20" fill="none" stroke="#e0a33a" stroke-width="1.2">
      <animate attributeName="r" values="20;42;20" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0;0.9" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- Amber aura core -->
    <circle r="30" fill="url(#amberGlowLure)">
      <animate attributeName="r" values="24;32;24" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle r="20" fill="#332714" stroke="#e0a33a" stroke-width="2.5"/>
    <text y="4" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="700" fill="#e0a33a" text-anchor="middle">TRIP</text>
    <text y="38" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="700" fill="#e0a33a" text-anchor="middle">passwords.xlsx</text>
    <text y="50" font-family="'IBM Plex Mono', monospace" font-size="8.5" fill="#e0a33a" text-anchor="middle">Decoy Triggered</text>
  </g>

  <!-- Stage 4: Alert & MITRE Correlation -->
  <g transform="translate(650, 120)">
    <circle r="20" fill="#142824" stroke="#c2553a" stroke-width="2"/>
    <text y="4" font-family="'IBM Plex Mono', monospace" font-size="9.5" font-weight="700" fill="#c2553a" text-anchor="middle">ALERT</text>
    <text y="38" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="600" fill="#e9e4d4" text-anchor="middle">T1083 / T1078</text>
    <text y="50" font-family="'IBM Plex Mono', monospace" font-size="8.5" fill="#8fa8a0" text-anchor="middle">99% Confidence</text>
  </g>

  <!-- Stage 5: Containment & Report -->
  <g transform="translate(780, 120)">
    <rect x="-24" y="-18" width="48" height="36" rx="4" fill="#1f3b36" stroke="#8fa8a0" stroke-width="1.5"/>
    <text y="4" font-family="'IBM Plex Mono', monospace" font-size="9.5" font-weight="700" fill="#e9e4d4" text-anchor="middle">DFIR</text>
    <text y="38" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="600" fill="#e9e4d4" text-anchor="middle">Playbook</text>
    <text y="50" font-family="'IBM Plex Mono', monospace" font-size="8.5" fill="#8fa8a0" text-anchor="middle">AI Forensics</text>
  </g>
</svg>
