<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 48" width="900" height="48">
  <!-- Subtle bathymetric datum line -->
  <line x1="0" y1="24" x2="900" y2="24" stroke="#1f3b36" stroke-width="1" stroke-dasharray="2 6"/>
  
  <!-- Central datum beacon -->
  <circle cx="450" cy="24" r="6" fill="#142824" stroke="#8fa8a0" stroke-width="1.2"/>
  <circle cx="450" cy="24" r="2.5" fill="#e0a33a">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Slowly drifting bathyal bubbles with staggered duration -->
  <g fill="none" stroke="#8fa8a0" stroke-width="1">
    <circle cx="120" cy="38" r="3" opacity="0.35">
      <animate attributeName="cy" values="42;6;42" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="18" r="4.5" opacity="0.45">
      <animate attributeName="cy" values="46;8;46" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="360" cy="30" r="2.5" opacity="0.3">
      <animate attributeName="cy" values="40;4;40" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="580" cy="35" r="3.5" opacity="0.4">
      <animate attributeName="cy" values="44;6;44" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.25;0.75;0.25" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="720" cy="15" r="2" opacity="0.5">
      <animate attributeName="cy" values="40;8;40" dur="6.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="830" cy="28" r="4" opacity="0.3">
      <animate attributeName="cy" values="44;4;44" dur="10s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
